name: CI

# Il floor di coverage vive in pyproject.toml ma finora non lo applicava
# nessuno: era sceso al 84.79% senza che se ne accorgesse alcuno. Questo
# workflow è ciò che lo rende vincolante.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # I test Qt costruiscono una QApplication: su un runner senza display
      # serve il backend offscreen.
      QT_QPA_PLATFORM: offscreen
      # `ui.hotkey` importa pynput a livello di modulo, e su Linux senza X11
      # il backend xorg fallisce all'import. Qui le hotkey non vengono mai
      # attivate, solo importate.
      PYNPUT_BACKEND: dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      # Gira su Linux benché l'app sia Windows-only: i test coprono logica
      # pura e widget Qt, mai le API Win32. `windows-capture` ha già il marker
      # `sys_platform == 'win32'`, quindi qui viene semplicemente saltato.
      - name: Install
        run: pip install -e ".[dev,app,vision]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # `--cov` applica `fail_under = 90` su engine/ e data/.
      - name: Test
        run: pytest --cov
