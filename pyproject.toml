[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokemon-helper"
version = "0.0.1"
description = "Windows overlay assistant for Pokemon emulators (Gen 1-5)"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Flavio Paravisi" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=4.0",
]
# Runtime deps for the interactive Windows app (F2+).
app = [
    "PySide6>=6.7",
    "pynput>=1.7",
]

# Vision / recognition (F0.2 sprite indexing + F3 runtime match).
# Kept separate from `app` so users who only want the overlay avoid
# the heavier optional stack (later: windows-capture, rapidocr-onnxruntime).
vision = [
    "Pillow>=10",
    "imagehash>=4.3",
]

[project.scripts]
pokemon-helper = "pokemon_helper.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pokemon_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["pokemon_helper.engine", "pokemon_helper.data"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
